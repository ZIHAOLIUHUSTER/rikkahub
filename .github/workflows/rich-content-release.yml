name: Study Final Release

on:
  push:
    branches: [codex/rich-content-no-google]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: study-final-release
  cancel-in-progress: true

env:
  FINAL_TAG: study-v2.5.6-1
  GH_TOKEN: ${{ github.token }}

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download privately signed draft APKs
        run: |
          test "$(gh release view "$FINAL_TAG" --json isDraft --jq .isDraft)" = true
          mkdir release-apks
          gh release download "$FINAL_TAG" --pattern '*.apk' --pattern SHA256SUMS.txt --dir release-apks
          (cd release-apks && sha256sum --check SHA256SUMS.txt)
      - name: Prepare Android emulator and APK tools
        run: |
          sdk_path="$RUNNER_TEMP/rikkahub-android-sdk"
          tools_zip="$RUNNER_TEMP/rikkahub-cmdline-tools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tools_zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tools_zip" | sha1sum --check -
          mkdir -p "$sdk_path/cmdline-tools"
          unzip -q "$tools_zip" -d "$sdk_path/cmdline-tools"
          mv "$sdk_path/cmdline-tools/cmdline-tools" "$sdk_path/cmdline-tools/latest"
          "$sdk_path/cmdline-tools/latest/bin/android" --sdk="$sdk_path" sdk install 'build-tools;37.0.0' emulator platform-tools 'system-images;android-35;google_apis;x86_64'
          echo "ANDROID_HOME=$sdk_path" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "$sdk_path/platform-tools" >> "$GITHUB_PATH"
      - name: Verify release identity and signatures
        run: |
          for apk in release-apks/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" > signer.txt
            grep -q 'certificate SHA-256 digest: 4b15d75da0e4461dc24506fb53e2aaa156b72c34b59a3fec3d56356525842909' signer.txt
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > badging.txt
            grep -q "name='me.rerere.rikkahub.study' versionCode='194' versionName='2.5.6-study.3'" badging.txt
            if grep -q 'application-debuggable' badging.txt; then exit 1; fi
          done
      - name: Install and launch the actual Release APK on Android 15
        run: |
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name study-final-test --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd study-final-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          timeout 300 adb wait-for-device
          python3 - <<'PYBOOT'
          import subprocess, time
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              r = subprocess.run(['adb', 'shell', 'getprop', 'sys.boot_completed'], capture_output=True, text=True, timeout=15)
              if r.stdout.strip() == '1':
                  break
              time.sleep(3)
          else:
              raise SystemExit('Android emulator did not complete boot')
          PYBOOT
          adb shell input keyevent 82
          adb install --no-streaming release-apks/RikkaHub-Study-universal.apk
          adb logcat -c
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n me.rerere.rikkahub.study/me.rerere.rikkahub.RouteActivity | tee launch.txt
          grep -q 'Status: ok' launch.txt
          sleep 10
          adb shell pidof me.rerere.rikkahub.study
          adb shell dumpsys activity activities > activity.txt
          grep -E '(mResumedActivity|topResumedActivity|ResumedActivity).*me.rerere.rikkahub.study/me.rerere.rikkahub.RouteActivity' activity.txt
          adb logcat -d -b crash > crash.txt
          if grep -q 'Process: me.rerere.rikkahub.study,' crash.txt; then cat crash.txt; exit 1; fi
          adb shell screencap -p /sdcard/study-final-start.png
          adb pull /sdcard/study-final-start.png study-final-start.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-final-validation
          if-no-files-found: ignore
          path: |
            launch.txt
            activity.txt
            crash.txt
            emulator.log
            signer.txt
            badging.txt
            study-final-start.png
      - name: Publish verified final release
        run: |
          gh release edit "$FINAL_TAG" --target "$GITHUB_SHA" --draft=false --prerelease=false --latest
