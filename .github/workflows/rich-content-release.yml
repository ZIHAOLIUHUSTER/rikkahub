name: Rich Content Preview

on:
  push:
    branches: [codex/rich-content-no-google]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rich-content-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Prepare Android SDK
        run: |
          sdk_path="$RUNNER_TEMP/rikkahub-android-sdk"
          tools_zip="$RUNNER_TEMP/rikkahub-cmdline-tools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tools_zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tools_zip" | sha1sum --check -
          mkdir -p "$sdk_path/cmdline-tools"
          unzip -q "$tools_zip" -d "$sdk_path/cmdline-tools"
          mv "$sdk_path/cmdline-tools/cmdline-tools" "$sdk_path/cmdline-tools/latest"
          "$sdk_path/cmdline-tools/latest/bin/android" --sdk="$sdk_path" sdk install 'platforms;android-37.0' 'platforms;android-37.2' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1' platform-tools
          echo "ANDROID_HOME=$sdk_path" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "$sdk_path/platform-tools" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: web-ui
        run: pnpm run typecheck
      - uses: gradle/actions/setup-gradle@v4
      - name: Test UI and build signed preview APKs
        run: >-
          bash gradlew :ui:testDebugUnitTest :app:assembleDebug
          --max-workers=2 --no-configuration-cache --console=plain
          -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
      - name: Verify actual HTML rendering in Android WebView
        timeout-minutes: 15
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/android" --sdk="$ANDROID_HOME" sdk install emulator 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name rich-content-test --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd rich-content-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          timeout 300 adb wait-for-device
          python3 - <<'PYBOOT'
          import subprocess, time
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              result = subprocess.run(['adb', 'shell', 'getprop', 'sys.boot_completed'], capture_output=True, text=True, timeout=15)
              if result.stdout.strip() == '1':
                  break
              time.sleep(3)
          else:
              raise SystemExit('Android emulator did not complete boot')
          PYBOOT
          adb shell input keyevent 82
          bash gradlew :ui:connectedDebugAndroidTest --max-workers=2 --no-configuration-cache --console=plain -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process
      - name: Prepare APKs and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/RikkaHub-Study-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/RikkaHub-Study-x86_64.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/RikkaHub-Study-universal.apk
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-content-build-results
          if-no-files-found: ignore
          path: |
            dist/
            ui/build/reports/tests/
            ui/build/test-results/
            ui/build/reports/androidTests/
            ui/build/outputs/androidTest-results/
            emulator.log
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: rich-content-v2.5.6-preview-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'RikkaHub 学习版 · HTML 预览修复版' --prerelease \
            --notes-file docs/development/rich-content-release-notes.md
